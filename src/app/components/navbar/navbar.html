<header
  class="fixed inset-x-0 top-0 z-50 border-b border-white/[0.08] transition-colors duration-300"
  [class.bg-bg/80]="scrolled()"
  [class.backdrop-blur-xl]="scrolled()"
>
  <nav
    class="mx-auto flex h-[4.5rem] max-w-7xl items-center justify-between px-6 md:h-20 md:px-10"
    aria-label="Navegación principal"
  >
    <a
      href="#inicio"
      class="flex items-center gap-2 text-xs font-semibold tracking-wide text-text transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
      (click)="closeMenu()"
    >
      <span class="grid size-7 place-items-center rounded-full border border-accent/60 text-[10px] text-accent">D</span>
      {{ profile.shortName }}
    </a>

    <button
      type="button"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.update((open) => !open)"
      class="inline-flex size-11 items-center justify-center rounded-full border border-white/15 text-text focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent md:hidden"
    >
      @if (menuOpen()) {
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none">
          <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      } @else {
        <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none">
          <path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      }
    </button>

    <div class="hidden items-center gap-8 md:flex">
      @for (item of profile.navigation; track item.href) {
        <a
          [href]="item.href"
          class="text-xs text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
        >{{ item.label }}</a>
      }
    </div>
  </nav>

  @if (menuOpen()) {
    <div class="border-t border-white/5 bg-bg/95 px-6 pb-6 pt-2 backdrop-blur-xl md:hidden">
      @for (item of profile.navigation; track item.href) {
        <a
          [href]="item.href"
          class="block py-3 text-sm text-muted transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          (click)="closeMenu()"
        >{{ item.label }}</a>
      }
    </div>
  }
</header>
