<section
  id="contacto"
  class="relative overflow-hidden px-6 py-32 md:px-10 md:py-48"
  aria-labelledby="contact-title"
>
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_85%_70%,rgb(160_186_93_/_11%),transparent_48%)]"></div>
  <div appReveal class="relative mx-auto grid max-w-7xl gap-10 md:grid-cols-[0.55fr_1.45fr] md:gap-20">
    <p class="flex items-center gap-4 text-[11px] uppercase tracking-[0.22em] text-muted">
      <span class="text-accent">04</span>
      <span class="h-px w-9 bg-white/25"></span>
      Conversemos
    </p>
    <div>
      <h2 id="contact-title" class="max-w-4xl text-5xl font-medium leading-[0.95] tracking-[-0.07em] text-text sm:text-6xl md:text-8xl">Las buenas ideas empiezan con un hola<span class="text-primary">.</span></h2>
      <p class="mt-7 max-w-lg text-sm leading-7 text-muted">Estoy abierto a conversar sobre ideas, proyectos y nuevas oportunidades.</p>
      <div class="mt-9 flex flex-wrap items-center gap-3">
        @if (profile.contact.email) {
          <a
            [href]="'mailto:' + profile.contact.email"
            class="inline-flex min-h-12 items-center gap-3 rounded-full bg-accent px-7 text-xs font-semibold text-bg transition duration-300 hover:scale-[1.02] hover:bg-text focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
          >
            Escríbeme
            <svg aria-hidden="true" viewBox="0 0 20 20" class="size-4" fill="none">
              <path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
        } @else {
          <span class="inline-flex min-h-12 items-center rounded-full border border-white/15 px-6 text-xs text-muted">Email próximamente</span>
        }
        @for (link of socialLinks; track link.label) {
          <a
            [href]="link.href"
            target="_blank"
            rel="noreferrer"
            class="inline-flex min-h-12 items-center justify-center rounded-full border border-white/25 px-6 text-xs text-text transition duration-300 hover:scale-[1.02] hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
          >{{ link.label }}</a>
        }
      </div>
    </div>
  </div>
</section>
