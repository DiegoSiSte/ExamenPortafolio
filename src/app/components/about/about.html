<section
  id="sobre-mi"
  class="relative overflow-hidden px-6 py-28 md:px-10 md:py-40"
  aria-labelledby="about-title"
>
  <div class="pointer-events-none absolute -right-32 top-10 size-[34rem] rounded-full bg-primary/[0.045] blur-[100px]"></div>
  <div class="mx-auto grid w-full max-w-7xl gap-12 md:grid-cols-[0.55fr_1.45fr] md:gap-20">
    <p appReveal class="flex items-center gap-4 text-[11px] uppercase tracking-[0.22em] text-muted">
      <span class="text-accent">01</span>
      <span class="h-px w-9 bg-white/25"></span>
      Un poco sobre mí
    </p>
    <div appReveal class="max-w-4xl">
      <h2 id="about-title" class="text-4xl font-medium leading-[1.07] tracking-[-0.06em] text-text sm:text-5xl md:text-7xl">
        Me gusta que lo útil también <span class="text-primary">se sienta bien.</span>
      </h2>
      <div class="mt-9 grid gap-7 md:grid-cols-[1.15fr_0.85fr] md:gap-14">
        <div class="mt-9 flow-root max-w-2xl md:mt-11">
          <img
            [ngSrc]="profile.portraitImage"
            width="480"
            height="480"
            loading="lazy"
            [alt]="'Retrato circular de ' + profile.name"
            class="float-left mb-3 mr-5 size-24 rounded-full border border-accent/35 object-cover shadow-[0_0_36px_rgb(214_237_131_/_12%)] sm:mr-7 sm:size-28 md:size-32"
          >
          <p class="text-sm leading-7 text-muted md:text-base md:leading-8">{{ profile.about }}</p>
        </div>
        <div class="border-l border-white/15 pl-5">
          <p class="text-[10px] uppercase tracking-[0.2em] text-muted">Desde</p>
          <p class="mt-2 text-sm text-text">{{ profile.location }}</p>
          <p class="mt-6 text-[10px] uppercase tracking-[0.2em] text-muted">Enfoque</p>
          <p class="mt-2 text-sm text-text">{{ profile.role }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
