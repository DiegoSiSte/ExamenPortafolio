<section
  id="inicio"
  class="relative isolate flex min-h-[780px] min-h-svh items-end overflow-hidden px-6 pb-28 pt-32 md:min-h-[880px] md:px-10 md:pb-24"
  aria-labelledby="hero-title"
>
  <div class="absolute inset-0 -z-10 overflow-hidden bg-[#182018]">
      <div class="absolute inset-y-0 right-0 w-[74%] overflow-hidden md:w-[min(42vw,33rem)]">
        @if (profile.heroImageAvailable) {
          <img
            [ngSrc]="profile.heroImage"
            width="533"
            height="1600"
            priority
            [alt]="'Retrato de ' + profile.name + ', ' + profile.role + ', en un bosque de Bolivia'"
            class="absolute left-0 top-1/2 h-auto w-full max-w-none -translate-y-[63%] opacity-90"
          >
        } @else {
          <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_70%_44%,rgb(136_155_103_/_30%),transparent_48%),linear-gradient(145deg,#273125,#11140f)]"></div>
        }
      </div>
    <div class="absolute inset-0 bg-gradient-to-t from-bg via-bg/35 to-bg/5"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-bg via-bg/80 to-transparent md:via-bg/55"></div>
    <div class="absolute inset-x-0 bottom-0 h-32 bg-gradient-to-t from-bg to-transparent"></div>
    <div class="animate-ambient-drift absolute -right-32 top-1/3 size-[30rem] rounded-full bg-primary/10 blur-[120px]"></div>
  </div>

  <div class="mx-auto w-full max-w-7xl">
    <div class="animate-hero-rise mb-16 flex items-center gap-3 text-[11px] uppercase tracking-[0.23em] text-text/85 [animation-delay:100ms] md:mb-20">
      <span class="size-2 rounded-full bg-accent shadow-[0_0_16px_rgb(214_237_131_/_70%)]"></span>
      {{ profile.role }}
      <span class="text-white/40">—</span>
      {{ profile.location }}
    </div>

    <div class="relative max-w-4xl">
      <p class="animate-hero-rise mb-5 text-sm tracking-wide text-white/80 [animation-delay:180ms] sm:text-base">Hola, soy Diego.</p>
      <h1 id="hero-title" class="animate-hero-rise max-w-4xl text-[clamp(3.35rem,11vw,9rem)] font-medium leading-[0.87] tracking-[-0.085em] text-text [animation-delay:260ms]">
        {{ profile.name }}
        <span class="text-accent">.</span>
      </h1>
      <p class="animate-hero-rise mt-7 max-w-md text-sm leading-7 text-white/80 [animation-delay:340ms] md:mt-9 md:text-base md:leading-8">
        {{ profile.introduction }}
      </p>
      <div class="animate-hero-rise mt-8 flex flex-wrap gap-3 [animation-delay:420ms]">
        <a
          href="#proyectos"
          class="inline-flex min-h-12 items-center gap-3 rounded-full bg-accent px-6 text-xs font-semibold text-bg transition duration-300 hover:scale-[1.02] hover:bg-text focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent sm:px-7"
        >
          Ver lo que hago
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-4" fill="none">
            <path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <a
          href="#contacto"
          class="inline-flex min-h-12 items-center justify-center rounded-full border border-white/40 px-6 text-xs text-text transition duration-300 hover:scale-[1.02] hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent sm:px-7"
        >Hablemos</a>
      </div>
    </div>
  </div>

  <a
    href="#sobre-mi"
    class="absolute bottom-8 right-6 flex items-center gap-3 text-[10px] uppercase tracking-[0.2em] text-white/75 transition-colors hover:text-text focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent md:right-10"
  >
    Sigue explorando
    <svg aria-hidden="true" viewBox="0 0 20 20" class="size-4" fill="none">
      <path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </a>
</section>
