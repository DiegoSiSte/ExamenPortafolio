<section
  id="habilidades"
  class="relative overflow-hidden bg-surface/55 px-6 py-24 md:px-10 md:py-32"
  aria-labelledby="skills-title"
>
  <div class="absolute -right-40 top-1/3 size-[30rem] rounded-full bg-accent/[0.06] blur-[130px]"></div>
  <div class="relative mx-auto w-full max-w-7xl">
    <div appReveal class="mb-14 max-w-2xl">
      <div class="mb-5 flex items-center gap-4">
        <span class="text-[11px] uppercase tracking-[0.22em] text-accent">03</span>
        <span class="h-px w-9 bg-white/25"></span>
        <p class="text-[11px] uppercase tracking-[0.22em] text-muted">Herramientas</p>
      </div>
      <h2 id="skills-title" class="text-4xl font-medium tracking-[-0.06em] text-text sm:text-5xl md:text-7xl">Tecnología con <span class="text-muted">propósito.</span></h2>
      <p class="mt-6 max-w-lg text-sm leading-7 text-muted">Las herramientas detrás de experiencias rápidas, accesibles y hechas para durar.</p>
    </div>
    <ul appReveal class="grid grid-cols-2 gap-px overflow-hidden border border-white/[0.06] bg-white/[0.06] sm:grid-cols-3 lg:grid-cols-5">
      @for (skill of skills; track skill) {
        <li class="group flex min-h-28 items-center justify-between bg-bg/90 p-5 transition-colors duration-300 hover:bg-primary/[0.09] sm:min-h-36 sm:p-7">
          <span class="text-sm text-text/85 transition-colors group-hover:text-primary sm:text-base">{{ skill }}</span>
          <span aria-hidden="true" class="text-xs text-muted/60 transition-transform duration-300 group-hover:translate-x-1 group-hover:text-primary">↗</span>
        </li>
      }
    </ul>
  </div>
</section>
